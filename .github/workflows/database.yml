name: database
on: 
  push:
defaults:
  run:
    working-directory: database
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@main
      - run: ./mssql/install.sh odbc 18
      - run: ./mssql/install.sh odbc-uninstall 18
      - run: ./mssql/install.sh odbc 17
      - run: ./mssql/install.sh odbc-uninstall 17
